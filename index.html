<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ModelNest – 3D Models for Your Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050b;--s1:#0d0d18;--s2:#141425;--bd:#24243a;--ink:#f3f4fb;--mut:#9a9bb5;--b:#18a0fb;--p:#a855f7;--g:linear-gradient(120deg,#18a0fb,#6d5cff 55%,#a855f7);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;background-image:radial-gradient(60rem 30rem at 85% -5%,rgba(109,92,255,.18),transparent),radial-gradient(40rem 25rem at -10% 20%,rgba(24,160,251,.12),transparent);background-repeat:no-repeat}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;line-height:1.15}
.w{max-width:1120px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,5,11,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
header img{height:30px;display:block;mix-blend-mode:screen;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto}nav button{background:none;border:0;color:var(--mut);font:500 .95rem Inter;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}nav button.on{color:#fff;background:var(--s2);box-shadow:inset 0 0 0 1px var(--bd)}
.btn{background:var(--g);color:#fff;border:0;padding:12px 22px;border-radius:12px;cursor:pointer;font:600 .95rem Inter;box-shadow:0 8px 24px rgba(109,92,255,.35);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(109,92,255,.5)}.btn:disabled{opacity:.6}
.btn.g{background:transparent;box-shadow:inset 0 0 0 1px var(--bd);color:var(--ink)}.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:9px;box-shadow:inset 0 0 0 1px var(--bd);background:transparent}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:56px 0 30px}
.pill{display:inline-block;border:1px solid var(--bd);background:var(--s1);color:var(--mut);padding:5px 14px;border-radius:99px;font-size:.82rem;margin-bottom:18px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:1.1rem;max-width:34rem;margin:16px 0 26px}.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero img{width:100%;display:block;mix-blend-mode:screen;filter:drop-shadow(0 0 50px rgba(109,92,255,.35));-webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 55%,transparent 78%)}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 56px}
.feat div{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px}.feat b{display:block;font-family:Sora;margin:6px 0 2px}.feat span{color:var(--mut);font-size:.88rem}.feat i{font-style:normal;font-size:1.5rem}
.sec{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}.sec h2{font-size:1.8rem}.sec p{color:var(--mut);margin:4px 0 0}
.search{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--ink);font:inherit;width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:60px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-6px);border-color:#4a4a8a;box-shadow:0 18px 40px rgba(109,92,255,.2)}
.img{aspect-ratio:1;background:linear-gradient(135deg,#10102a,#1b1340);display:flex;align-items:center;justify-content:center;font-size:3.5rem;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover .img img{transform:scale(1.06)}
.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:1.05rem}.mut{color:var(--mut);font-size:.9rem}
.price{font:800 1.3rem Sora;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:1px 10px;font-size:.78rem;color:var(--mut);align-self:flex-start}
.add{border:2px dashed #3a3a6a;background:transparent;align-items:center;justify-content:center;min-height:300px;cursor:pointer;color:var(--mut);gap:8px;font:600 1rem Sora}.add b{font-size:3.5rem;font-weight:400;line-height:1;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;font-size:2.1rem;line-height:1;border:0;background:var(--g);color:#fff;box-shadow:0 8px 28px rgba(109,92,255,.6);cursor:pointer;z-index:15}
.hide{display:none!important}
.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:24px;margin-bottom:60px;padding-top:36px}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:22px}.steps div{display:flex;gap:14px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px}.steps em{font:800 1.1rem Sora;font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex:none}.steps span{color:var(--mut);font-size:.9rem;display:block}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}
label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit}input:focus,textarea:focus{outline:2px solid #6d5cff;border-color:transparent}
.pay{display:flex;gap:8px}.pay label{flex:1;border:1px solid var(--bd);border-radius:11px;padding:11px;color:var(--ink);cursor:pointer;margin:0;display:flex;gap:7px;align-items:center;font-size:.9rem}.pay input{width:auto}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--s1);color:var(--ink);width:min(480px,94vw);padding:24px;max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.note{border:1px dashed var(--bd);border-radius:16px;padding:30px;color:var(--mut);text-align:center;margin-bottom:60px}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mut);font-size:.9rem;text-align:center}footer img{height:34px;mix-blend-mode:screen;display:block;margin:0 auto 10px}
@media(max-width:800px){.hero,.two{grid-template-columns:1fr}.hero{padding-top:28px}.feat{grid-template-columns:1fr 1fr}.hero img{max-width:420px;margin:auto}header img{height:24px}}
.link{background:none;border:0;color:var(--b);cursor:pointer;font:inherit;padding:0}.link:hover{text-decoration:underline}
.gb{width:100%;margin-top:10px;font-weight:600}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--g);display:flex;align-items:center;justify-content:center;font:800 2rem Sora;color:#fff;flex:none}
.vb{background:#3a2a05;color:#ffd27a;text-align:center;padding:8px 12px;font-size:.9rem;border-bottom:1px solid #5a4210}
code{background:var(--s2);padding:2px 6px;border-radius:6px;font-size:.8rem;word-break:break-all}
.box h3{margin-bottom:4px}
</style></head><body>

<script type="module">
/* ====== 1) PASTE YOUR FIREBASE CONFIG HERE ====== */
const FB={apiKey:"PASTE_HERE",authDomain:"PASTE_HERE",projectId:"PASTE_HERE",storageBucket:"PASTE_HERE",messagingSenderId:"PASTE_HERE",appId:"PASTE_HERE"};
/* ====== 2) PUT YOUR OWN GOOGLE EMAIL HERE (only this account can add products & see orders) ====== */
const OWNER_EMAIL="youremail@gmail.com";
/* ================================================ */
let P;const boot=()=>P||(P=(async()=>{
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,F,S,U]=await Promise.all(['app','firestore','storage','auth'].map(n=>import(B+'firebase-'+n+'.js')));
  const app=A.initializeApp(FB),fs=F.getFirestore(app),st=S.getStorage(app),au=U.getAuth(app);
  await au.authStateReady();
  const wrap=r=>({set:d=>F.setDoc(r,/^(orders|customs)\//.test(r.path)?{...d,uid:au.currentUser&&au.currentUser.uid,email:au.currentUser&&au.currentUser.email}:d),update:d=>F.updateDoc(r,d),delete:()=>F.deleteDoc(r),
    onSnapshot:cb=>F.onSnapshot(r,s=>cb({exists:s.exists(),data:()=>s.data(),id:s.id}))});
  const db={doc:p=>wrap(F.doc(fs,p)),collection:n=>({onSnapshot:cb=>F.onSnapshot(F.collection(fs,n),cb)})};
  const assets={upload:async f=>{const own=au.currentUser&&au.currentUser.email===OWNER_EMAIL;
    const r=S.ref(st,(own?'products/':'customs/')+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_'));
    await S.uploadBytes(r,f);return {url:await S.getDownloadURL(r)}}};
  const user={canEdit:()=>!!au.currentUser&&au.currentUser.emailVerified&&au.currentUser.email===OWNER_EMAIL};
  return {db,assets,user,auth:{au,U,F,fs,S,st}};
})());
window.claude={use:async n=>(await boot())[n]};

$('#fab').onclick=()=>addProduct();
function addProduct(){
  const d=dlg(`<h2 style="font-size:1.4rem">Add new <span class="gt">3D model</span></h2>
  <label>Name</label><input id="n"><label>Price (₹)</label><input id="pr" type="number" min="0"><label>Description</label><textarea id="ds" rows="3"></textarea>
  <label>Material / size (optional)</label><input id="mt" placeholder="PLA, 10 cm tall"><label>Photo</label><input id="im" type="file" accept="image/*"><label>3D model file (STL / OBJ / 3MF)</label><input id="fl" type="file">
  <div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Add model</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelector('#ok').onclick=async e=>{
    const n=d.querySelector('#n').value.trim(),pr=d.querySelector('#pr').value;
    if(!n||pr==='')return toast('Please enter name and price');
    e.target.disabled=true;e.target.textContent='Uploading…';
    try{const im=d.querySelector('#im').files[0],fl=d.querySelector('#fl').files[0];
      const i=im?await assets.upload(im):null,f=fl?await assets.upload(fl):null;
      await db.doc('products/p'+Date.now()).set({name:n,price:Number(pr),desc:d.querySelector('#ds').value,material:d.querySelector('#mt').value,image:i?i.url:'',file:f?f.url:'',at:Date.now()});close();
    }catch(err){toast('Could not save: '+(err.message||err.code));e.target.disabled=false;e.target.textContent='Add model'}
  };
}
function payBlock(){return `<label>Payment method</label><div class="pay"><label><input type="radio" name="pm" value="COD" checked> 💵 Cash on Delivery</label><label><input type="radio" name="pm" value="Online"> 📱 Online (phone pay)</label></div><div id="pinfo" class="mut hide" style="margin-top:8px">Pay to phone number <b style="color:var(--ink)">${esc(settings.payPhone||'(not set yet)')}</b> using any UPI app, then enter the transaction ID below.</div><div id="txw" class="hide"><label>Transaction ID</label><input id="tx"></div>`}
function wirePay(d){d.querySelectorAll('[name=pm]').forEach(r=>r.onchange=()=>{const on=d.querySelector('[name=pm]:checked').value==='Online';d.querySelector('#pinfo').classList.toggle('hide',!on);d.querySelector('#txw').classList.toggle('hide',!on)})}
function checkout(p){
  const d=dlg(`<h2 style="font-size:1.3rem">${esc(p.name)} <span class="gt">· ₹${esc(p.price)}</span></h2>
  <label>Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel"><label>Delivery address</label><textarea id="ad" rows="3"></textarea>${payBlock()}
  <div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Place order</button></div>`);wirePay(d);
  d.querySelector('#x').onclick=close;
  d.querySelector('#ok').onclick=async e=>{
    const n=d.querySelector('#n').value.trim(),ph=d.querySelector('#ph').value.trim(),ad=d.querySelector('#ad').value.trim();
    if(!n||!ph||!ad)return toast('Please fill name, phone and address');
    e.target.disabled=true;
    try{await db.doc('orders/o'+Date.now()).set({product:p.name,price:p.price,name:n,phone:ph,address:ad,payment:d.querySelector('[name=pm]:checked').value,txn:d.querySelector('#tx').value,status:'New',at:Date.now()});
      close();dlg(`<h2 style="font-size:1.4rem">✅ Order placed!</h2><p class="mut">Thank you, ${esc(n)}. We’ll contact you on ${esc(ph)} to confirm your order.</p><div class="row"><button class="btn" onclick="close()">Done</button></div>`)}
    catch(err){toast('Could not place order: '+(err.message||err.code));e.target.disabled=false}
  };
}
function custom(m){
  m.innerHTML=`<div class="two"><div><span class="pill">🛠 Custom printing</span><h2 style="font-size:2.2rem">Print <span class="gt">your own</span> 3D model</h2><p class="mut">Have a design? Upload it with your details and we’ll print it and deliver it to you.</p>
  <div class="steps"><div><em>1</em><p style="margin:0"><b>Upload your file</b><span>STL, OBJ or 3MF with size &amp; colour</span></p></div><div><em>2</em><p style="margin:0"><b>We review &amp; quote</b><span>We call you with price and delivery time</span></p></div><div><em>3</em><p style="margin:0"><b>We print &amp; ship</b><span>Pay by Cash on Delivery or online</span></p></div></div></div>
  <div class="box" id="cf"><label style="margin-top:0">Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel"><label>Delivery address</label><textarea id="ad" rows="2"></textarea>
  <label>Upload your file</label><input id="fl" type="file"><label>Details (size, colour, material, quantity…)</label><textarea id="dt" rows="3"></textarea>${payBlock()}
  <div class="row"><button class="btn" id="ok" style="width:100%">Send request</button></div></div></div>`;
  const f=$('#cf');wirePay(f);
  $('#ok').onclick=async e=>{
    const g=s=>f.querySelector(s).value.trim(),file=f.querySelector('#fl').files[0];
    if(!g('#n')||!g('#ph')||!g('#ad')||!file)return toast('Please fill name, phone, address and choose a file');
    e.target.disabled=true;e.target.textContent='Uploading…';
    try{const a=await (assets||await claude.use('assets')).upload(file);
      await db.doc('customs/c'+Date.now()).set({name:g('#n'),phone:g('#ph'),address:g('#ad'),details:g('#dt'),file:a.url,fileName:file.name,payment:f.querySelector('[name=pm]:checked').value,txn:f.querySelector('#tx').value,status:'New',at:Date.now()});
      f.innerHTML='<h2 style="font-size:1.4rem">✅ Request sent!</h2><p class="mut">We’ll review your file and contact you with the price and delivery time.</p>';
    }catch(err){toast('Could not send: '+(err.message||err.code||'upload not allowed'));e.target.disabled=false;e.target.textContent='Send request'}
  };
}
function oc(o,col,c){return `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${c?'🛠 Custom print':esc(o.product)+' — ₹'+esc(o.price)}</b><span class="tag">${esc(o.status)}</span></div>
  <div class="mut">${esc(o.name)} · <a style="color:var(--b)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${new Date(o.at).toLocaleString()}</div><div>${esc(o.address)}</div><div class="mut">Payment: ${esc(o.payment)}${o.txn?' · Txn '+esc(o.txn):''}</div>
  ${c?`<p>${esc(o.details)}</p><a style="color:var(--b)" href="${esc(o.file)}" download="${esc(o.fileName)}">⬇ Download ${esc(o.fileName)}</a>`:''}
  <div class="row" style="justify-content:flex-start">${['New','Printing','Shipped','Done'].map(s=>`<button class="btn sm" data-s="${col}/${o.id}|${s}">${s}</button>`).join('')}<button class="btn sm" data-d="${col}/${o.id}">Delete</button></div></div>`}
function ordersV(m){
  const all=[...orders.map(o=>oc(o,'orders',0)),...customs.map(o=>oc(o,'customs',1))];
  m.innerHTML=`<div class="sec" style="margin-top:36px"><h2>Your <span class="gt">orders</span></h2></div>`+(all.length?all.join(''):'<div class="note">No orders yet.</div>');
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const[p,s]=b.dataset.s.split('|');db.doc(p).update({status:s})});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete?'))db.doc(b.dataset.d).delete()});
}
function settingsV(m){
  m.innerHTML=`<div class="sec" style="margin-top:36px"><h2>Store <span class="gt">settings</span></h2></div><div class="box"><label style="margin-top:0">Phone number for online payment (UPI)</label><input id="sp" type="tel" value="${esc(settings.payPhone)}"><div class="row"><button class="btn" id="sv">Save</button></div></div>`;
  $('#sv').onclick=async()=>{await db.doc('settings/shop').set({payPhone:$('#sp').value});toast('Saved')};
}
async function init(){
  render();
  try{
    const user=await claude.use('user');isOwner=user?user.canEdit():false;
    db=await claude.use('db');assets=await claude.use('assets');
    if(!db){render();return}
    db.collection('products').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));if(!document.activeElement||document.activeElement.id!=='sr')render()});
    db.doc('settings/shop').onSnapshot(s=>{if(s.exists)settings={...settings,...s.data()}});
    if(isOwner){
      db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);if(tab==='orders')render();else renderNav()});
      db.collection('customs').onSnapshot(s=>{customs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);if(tab==='orders')render();else renderNav()});
    }
  }catch(e){console.error(e)}
  render();
}
init();
</script>

async function google(){try{const r=await A.U.signInWithPopup(A.au,new A.U.GoogleAuthProvider());await ensureProfile(r.user);done()}catch(e){toast(errMsg(e))}}
function authDlg(mode){
  const t={login:'Welcome <span class="gt">back</span>',signup:'Create your <span class="gt">account</span>',forgot:'Reset <span class="gt">password</span>'}[mode];
  const d=dlg(`<h2 style="font-size:1.4rem">${t}</h2>
  ${mode==='signup'?'<label>Username</label><input id="un" autocomplete="username">':''}
  <label>Email</label><input id="em" type="email" autocomplete="email">
  ${mode!=='forgot'?'<label>Password</label><input id="pw" type="password" autocomplete="'+(mode==='signup'?'new':'current')+'-password">':''}
  ${mode==='signup'?'<label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password">':''}
  <div class="row"><button class="btn" id="go" style="width:100%">${{login:'Login',signup:'Sign up',forgot:'Send reset link'}[mode]}</button></div>
  ${mode!=='forgot'?'<button class="btn g gb" id="gg">G &nbsp;Continue with Google</button>':''}
  <div class="mut" style="margin-top:14px;text-align:center">${mode==='login'?'<button class="link" data-m="forgot">Forgot password?</button> · <button class="link" data-m="signup">Create account</button>':mode==='signup'?'Already have an account? <button class="link" data-m="login">Login</button>':'<button class="link" data-m="login">← Back to login</button>'}</div>
  <div class="row"><button class="btn sm" id="x">Close</button></div>`);
  d.querySelector('#x').onclick=close;
  d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authDlg(b.dataset.m));
  const g=d.querySelector('#gg');if(g)g.onclick=google;
  const v=s=>(d.querySelector(s)?.value||'').trim();
  d.querySelector('#go').onclick=async e=>{
    const em=v('#em'),pw=d.querySelector('#pw')?.value||'';
    if(!em)return toast('Please enter your email');
    e.target.disabled=true;
    try{
      if(mode==='forgot'){await A.U.sendPasswordResetEmail(A.au,em);toast('Reset link sent! Check your email (also the spam folder).');e.target.disabled=false;return}
      if(mode==='login'){await A.U.signInWithEmailAndPassword(A.au,em,pw);done();return}
      const un=v('#un');if(!un)throw{message:'Please enter a username'};
      if(pw!==d.querySelector('#pw2').value)throw{message:'Passwords do not match'};
      const r=await A.U.createUserWithEmailAndPassword(A.au,em,pw);
      await A.U.updateProfile(r.user,{displayName:un});
      await ensureProfile(r.user,{username:un});
      await A.U.sendEmailVerification(r.user);
      const d2=dlg(`<h2 style="font-size:1.4rem">✅ Account created!</h2><p class="mut">We sent a verification link to <b>${esc(em)}</b>. Open it (check spam too), then tap below.</p><div class="row"><button class="btn g" id="lt">Later</button><button class="btn" id="vd">I’ve verified</button></div>`);
      d2.querySelector('#lt').onclick=done;
      d2.querySelector('#vd').onclick=async()=>{await A.U.reload(A.au.currentUser);done()};
    }catch(err){toast(errMsg(err));e.target.disabled=false}
  };
}
function verifyDlg(){
  const d=dlg(`<h2 style="font-size:1.4rem">Verify your <span class="gt">email</span></h2><p class="mut">We sent a link to <b>${esc(cu.email)}</b>. Open it, then tap “I’ve verified”.</p><div class="row"><button class="btn g" id="rs">Resend email</button><button class="btn" id="ok">I’ve verified</button></div>`);
  d.querySelector('#rs').onclick=async()=>{try{await A.U.sendEmailVerification(cu);toast('Verification email sent again.')}catch(e){toast(errMsg(e))}};
  d.querySelector('#ok').onclick=async()=>{await A.U.reload(cu);if(A.au.currentUser.emailVerified)done();else toast('Not verified yet. Please open the link in your email first.')};
}
function banner(){
  document.getElementById('vb')?.remove();
  if(cu&&!cu.emailVerified){document.querySelector('header').insertAdjacentHTML('afterend','<div id="vb" class="vb">⚠️ Please verify your email to place orders. <button class="link" id="vv">Verify now</button></div>');$('#vv').onclick=verifyDlg}
}
const _rn=renderNav;
renderNav=function(){
  _rn();const n=$('#nav');
  if(cu)n.insertAdjacentHTML('beforeend',`<button id="npf" class="${tab==='profile'?'on':''}">👤 ${esc(prof.username||cu.displayName||'Profile')}</button><button id="nlo">Logout</button>`);
  else n.insertAdjacentHTML('beforeend','<button id="nli" style="color:#fff;background:var(--g)">Login / Sign up</button>');
  if(cu){$('#npf').onclick=()=>{tab='profile';render();scrollTo({top:0})};$('#nlo').onclick=async()=>{await A.U.signOut(A.au);location.reload()}}
  else $('#nli').onclick=()=>authDlg('login');
};
const _r=render;
render=function(){
  if(tab==='profile'&&!cu)tab='shop';
  if(tab==='profile'){renderNav();$('#fab').classList.add('hide');profileV($('#main'))}else _r();
};
const _co=checkout;
checkout=function(p){if(!cu)return authDlg('login');if(!cu.emailVerified)return verifyDlg();_co(p);const n=$('#dlg #n');if(n)n.value=prof.fullName||prof.username||''};
const _cu=custom;
custom=function(m){
  if(!ok()){m.innerHTML=`<div class="note" style="margin-top:40px"><h3 style="color:var(--ink)">🔒 ${cu?'Please verify your email':'Please login first'}</h3><p>You need a verified account to send a custom print request.</p><button class="btn" id="gl">${cu?'Verify email':'Login / Sign up'}</button></div>`;$('#gl').onclick=()=>cu?verifyDlg():authDlg('login');return}
  _cu(m);const n=m.querySelector('#n');if(n)n.value=prof.fullName||prof.username||'';
};
function avatar(p){return p.photo?`<img class="av" src="${esc(p.photo)}" alt="">`:`<div class="av">${esc((p.username||'?')[0].toUpperCase())}</div>`}
function profileV(m){
  const p=prof,u=cu;
  m.innerHTML=`<div class="sec" style="margin-top:36px"><h2>My <span class="gt">profile</span></h2></div>
  <div class="box" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${avatar(p)}<div><b style="font:700 1.3rem Sora">${esc(p.username)}</b><div class="mut">${esc(u.email)} · ${u.emailVerified?'✅ Verified':'⚠️ Not verified'}</div><div class="mut">User ID: <code>${esc(u.uid)}</code> <button class="link" id="cp">Copy</button></div></div></div>
  <div class="box"><h3>Edit profile</h3><label>Profile picture</label><input id="ph" type="file" accept="image/*">
  <label>Username</label><input id="un" value="${esc(p.username)}"><label>Full name</label><input id="fn" value="${esc(p.fullName)}">
  <label>Bio</label><textarea id="bi" rows="3" maxlength="200">${esc(p.bio)}</textarea>
  <label>Country (optional)</label><input id="co" value="${esc(p.country)}"><label>City (optional)</label><input id="ci" value="${esc(p.city)}">
  <div class="row"><button class="btn" id="sv">Save profile</button></div></div>
  <div class="box"><h3>Change password</h3>${pwUser()?`<label>Current password</label><input id="op" type="password" autocomplete="current-password"><label>New password</label><input id="np" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="np2" type="password" autocomplete="new-password"><div class="row"><button class="btn" id="cpw">Change password</button></div>`:'<p class="mut">You signed in with Google, so your password is managed in your Google account.</p>'}</div>
  <div class="box" style="border-color:#6b2030"><h3 style="color:#ff6b6b">Delete account</h3><p class="mut">This permanently deletes your account and profile.</p><button class="btn" id="del" style="background:#d62839">Delete my account</button></div>`;
  $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(u.uid);toast('User ID copied')};
  $('#sv').onclick=async e=>{
    const un=$('#un').value.trim();if(!un)return toast('Username is required');
    e.target.disabled=true;e.target.textContent='Saving…';
    try{let photo=p.photo||'';const f=$('#ph').files[0];
      if(f){const r=A.S.ref(A.st,'avatars/'+u.uid+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_'));await A.S.uploadBytes(r,f);photo=await A.S.getDownloadURL(r)}
      await A.F.setDoc(A.F.doc(A.fs,'users/'+u.uid),{uid:u.uid,email:u.email,username:un,fullName:$('#fn').value.trim(),bio:$('#bi').value.trim(),country:$('#co').value.trim(),city:$('#ci').value.trim(),photo},{merge:true});
      await A.U.updateProfile(u,{displayName:un});toast('Profile saved ✅');setTimeout(()=>profileV(m),300);
    }catch(err){toast(errMsg(err))}
    e.target.disabled=false;e.target.textContent='Save profile';
  };
  if($('#cpw'))$('#cpw').onclick=async e=>{
    if($('#np').value!==$('#np2').value)return toast('New passwords do not match');
    e.target.disabled=true;
    try{await A.U.reauthenticateWithCredential(u,A.U.EmailAuthProvider.credential(u.email,$('#op').value));await A.U.updatePassword(u,$('#np').value);toast('Password changed ✅');['#op','#np','#np2'].forEach(s=>$(s).value='')}
    catch(err){toast(errMsg(err))}e.target.disabled=false;
  };
  $('#del').onclick=()=>{
    const d=dlg(`<h2 style="font-size:1.4rem;color:#ff6b6b">Delete account?</h2><p class="mut">This cannot be undone.</p>${pwUser()?'<label>Enter your password to confirm</label><input id="dp" type="password">':''}<div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="dy" style="background:#d62839">Delete forever</button></div>`);
    d.querySelector('#x').onclick=close;
    d.querySelector('#dy').onclick=async e=>{
      e.target.disabled=true;
      try{if(pwUser())await A.U.reauthenticateWithCredential(u,A.U.EmailAuthProvider.credential(u.email,d.querySelector('#dp').value));else await A.U.reauthenticateWithPopup(u,new A.U.GoogleAuthProvider());
        await A.F.deleteDoc(A.F.doc(A.fs,'users/'+u.uid));await A.U.deleteUser(u);alert('Your account was deleted.');location.reload();
      }catch(err){toast(errMsg(err));e.target.disabled=false}
    };
  };
}
(async()=>{
  A=await claude.use('auth');cu=A.au.currentUser;
  if(cu){try{await ensureProfile(cu)}catch(e){}A.F.onSnapshot(A.F.doc(A.fs,'users/'+cu.uid),s=>{prof=s.data()||{};renderNav()})}
  renderNav();banner();
})();
</script>
</body></html>
