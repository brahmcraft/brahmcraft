<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Brahmcraft Models – 3D Models for Your Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050b;--s1:#0d0d18;--s2:#141425;--bd:#24243a;--ink:#f3f4fb;--mut:#9a9bb5;--b:#18a0fb;--g:linear-gradient(120deg,#18a0fb,#6d5cff 55%,#a855f7);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;background-image:radial-gradient(60rem 30rem at 85% -5%,rgba(109,92,255,.18),transparent);background-repeat:no-repeat}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;line-height:1.15}
.w{max-width:1120px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,11,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{font:800 1.2rem Sora;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;letter-spacing:.04em}.logo img{height:42px;mix-blend-mode:screen}.flogo{height:90px;mix-blend-mode:screen;display:block;margin:0 auto 10px}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;overflow-x:auto}nav button{background:none;border:0;color:var(--mut);font:500 .95rem Inter;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}nav button.on{color:#fff;background:var(--s2);box-shadow:inset 0 0 0 1px var(--bd)}
.btn{background:var(--g);color:#fff;border:0;padding:12px 22px;border-radius:12px;cursor:pointer;font:600 .95rem Inter;box-shadow:0 8px 24px rgba(109,92,255,.35);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6}
.btn.g{background:transparent;box-shadow:inset 0 0 0 1px var(--bd);color:var(--ink)}.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:9px;box-shadow:inset 0 0 0 1px var(--bd);background:transparent}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:56px 0 30px}
.pill{display:inline-block;border:1px solid var(--bd);background:var(--s1);color:var(--mut);padding:5px 14px;border-radius:99px;font-size:.82rem;margin-bottom:18px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mut);font-size:1.1rem;max-width:34rem;margin:16px 0 26px}.cta{display:flex;gap:12px;flex-wrap:wrap}
.art{max-width:460px;margin:auto;width:100%}.art img{width:100%;display:block;mix-blend-mode:screen}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 56px}
.feat div{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px}.feat b{display:block;font-family:Sora;margin:6px 0 2px}.feat span{color:var(--mut);font-size:.88rem}.feat i{font-style:normal;font-size:1.5rem}
.sec{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}.sec h2{font-size:1.8rem}.sec p{color:var(--mut);margin:4px 0 0}
.search{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--ink);font:inherit;width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:60px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-6px);border-color:#4a4a8a}
.img{aspect-ratio:1;background:linear-gradient(135deg,#10102a,#1b1340);display:flex;align-items:center;justify-content:center;font-size:3.5rem;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}
.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:1.05rem}.mut{color:var(--mut);font-size:.9rem}
.price{font:800 1.3rem Sora;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:1px 10px;font-size:.78rem;color:var(--mut);align-self:flex-start}
.add{border:2px dashed #3a3a6a;background:transparent;align-items:center;justify-content:center;min-height:300px;cursor:pointer;color:var(--mut);font:600 1rem Sora}.add b{font-size:3.5rem;font-weight:400;line-height:1}
.fab{position:fixed;right:20px;bottom:20px;width:62px;height:62px;border-radius:50%;font-size:2.1rem;border:0;background:var(--g);color:#fff;cursor:pointer;z-index:15}
.hide{display:none!important}
.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:24px;margin-bottom:60px;padding-top:36px}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:22px}.steps div{display:flex;gap:14px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px}.steps em{font:800 1.1rem Sora;font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex:none}.steps span{color:var(--mut);font-size:.9rem;display:block}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}
label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit}input:focus,textarea:focus{outline:2px solid #6d5cff;border-color:transparent}
.pay{display:flex;gap:8px}.pay label{flex:1;border:1px solid var(--bd);border-radius:11px;padding:11px;color:var(--ink);cursor:pointer;margin:0;display:flex;gap:7px;align-items:center;font-size:.9rem}.pay input{width:auto}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--s1);color:var(--ink);width:min(480px,94vw);padding:24px;max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.7)}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.note{border:1px dashed var(--bd);border-radius:16px;padding:30px;color:var(--mut);text-align:center;margin-bottom:60px}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mut);font-size:.9rem;text-align:center}footer .logo{display:block;margin-bottom:8px;cursor:default}
.lnk{background:none;border:0;color:var(--mut);cursor:pointer;text-decoration:underline;font:inherit;margin-top:8px}
dialog.big{width:min(820px,96vw)}.pd{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stars{color:#fbbf24;letter-spacing:2px}.rv{border-top:1px solid var(--bd);padding:14px 0}
.rvp{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.rvp img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.md{margin-top:18px;color:#d5d6ea;font-size:.95rem}.md h4{font:700 1.05rem Sora;margin:14px 0 4px;color:var(--ink)}.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:20px}.md hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
.pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 290px;gap:26px;margin:18px 0 10px;align-items:start}
.pimg{border-radius:18px;border:1px solid var(--bd)}.hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.buybox{position:sticky;top:80px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px}
.psec{margin:38px 0}.psec h2{font-size:1.5rem;margin-bottom:12px}.rgrid{display:grid;grid-template-columns:340px 1fr;gap:34px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem;color:var(--mut)}.bar span:first-child{width:34px}.bar span:last-child{width:38px;text-align:right}
.track{flex:1;height:10px;background:var(--s2);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#fbbf24}
.av{width:30px;height:30px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700}
@media(max-width:800px){.hero,.two,.pd,.pp,.rgrid{grid-template-columns:1fr}.buybox{position:static}.hero{padding-top:28px}.feat{grid-template-columns:1fr 1fr}.art{max-width:320px}.logo .lt{display:none}}
</style></head><body>

let rsum={};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
async function loadSummary(){const{data}=await sb.from('reviews').select('product_id,rating');rsum={};(data||[]).forEach(r=>{const x=rsum[r.product_id]||(rsum[r.product_id]={n:0,t:0});x.n++;x.t+=r.rating})}
const ratingLine=id=>{const x=rsum[id];return x?`<span class="mut"><span class="stars">★</span> ${(x.t/x.n).toFixed(1)} (${x.n} review${x.n>1?'s':''})</span>`:'<span class="mut">No reviews yet</span>'};
function md(t){
  const out=[];let list=false;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  for(const raw of String(t||'').split('\n')){
    const l=raw.trim(),li=l.match(/^[-*•]\s+(.*)/);
    if(li){if(!list){out.push('<ul>');list=true}out.push('<li>'+inl(li[1])+'</li>');continue}
    if(list){out.push('</ul>');list=false}
    if(!l)continue;
    if(/^[-_*]{3,}$/.test(l)){out.push('<hr>');continue}
    const h=l.match(/^#{1,4}\s+(.*)/);out.push(h?'<h4>'+inl(h[1])+'</h4>':'<p>'+inl(l)+'</p>');
  }
  if(list)out.push('</ul>');return out.join('')}
async function shrink(f){
  try{const bm=await createImageBitmap(f),sc=Math.min(1,1200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
  catch(e){throw new Error('Could not read a photo. Please use JPG or PNG.')}}
async function upReview(f){const b=await shrink(f),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const{error}=await sb.storage.from('review-photos').upload(path,b,{contentType:'image/jpeg'});if(error)throw error;
  return sb.storage.from('review-photos').getPublicUrl(path).data.publicUrl}

function openProduct(id){location.hash='product-'+id}

async function productV(m){

}

    <label>Your review</label><textarea id="rc" rows="3" maxlength="1500"></textarea><label>Add photos (up to 3, optional)</label><input id="rp" type="file" accept="image/*" multiple>
    <div id="rmsg" class="mut" style="margin-top:10px"></div><div class="row"><button class="btn" id="rsub" style="width:100%">Submit review</button></div></div>
  <div>${ph.length?`<h3>Reviews with images</h3><div class="rvp" style="margin-bottom:18px">${ph.slice(0,8).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Customer photo"></a>`).join('')}</div>`:''}
  <h3>Top reviews</h3>${n?rv.map(reviewHtml).join(''):'<p class="mut">No reviews yet. Be the first to review this product!</p>'}</div></div></section>`;
  $('#bk').onclick=()=>go('shop');$('#by').onclick=()=>checkout(p);$('#rl').onclick=()=>$('#revs').scrollIntoView({behavior:'smooth'});
  const msg=(t,bad)=>{const x=$('#rmsg');x.textContent=t;x.style.color=bad?'#ff8a8a':'#9a9bb5'};
  let rating=0;const rs=$('#rs'),drawS=()=>{rs.innerHTML=[1,2,3,4,5].map(i=>`<span data-v="${i}">${i<=rating?'★':'☆'}</span>`).join('')};
  drawS();rs.onclick=e=>{if(e.target.dataset.v){rating=+e.target.dataset.v;drawS()}};
  m.querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this review?'))return;const{error}=await sb.from('reviews').delete().eq('id',b.dataset.rd);if(error)return toast(error.message);await loadSummary();await productV(m)});
  $('#rsub').onclick=async e=>{
    const nm=$('#rn').value.trim(),files=[...$('#rp').files];
    if(!nm)return msg('Please enter your name',1);if(!rating)return msg('Please choose a star rating',1);if(files.length>3)return msg('Please choose up to 3 photos',1);
    e.target.disabled=true;
    try{const urls=[];for(const f of files){msg('Uploading photo '+(urls.length+1)+' of '+files.length+'…');urls.push(await upReview(f))}
      msg('Saving review…');
      const{error}=await sb.from('reviews').insert({product_id:p.id,name:nm,rating,comment:$('#rc').value.trim(),photos:urls});if(error)throw error;
      await loadSummary();await productV(m);const r=$('#revs');if(r)r.scrollIntoView();toast('Thank you! Your review was added.');
    }catch(err){msg('Error: '+(err.message||err),1);e.target.disabled=false}
  };
}
const stockTag=n=>n>5?`<span class="mut" style="color:#6ee7a0">● In stock: ${n}</span>`:n>0?`<span class="mut" style="color:#fbbf24">● Only ${n} left!</span>`:`<span class="mut" style="color:#ff8a8a">● Out of stock</span>`;
function addProduct(){
  const d=dlg(`<h2 style="font-size:1.4rem">Add new <span class="gt">3D model</span></h2>
  <label>Name</label><input id="n"><label>Price (₹)</label><input id="pr" type="number" min="0"><label>Stock (how many available)</label><input id="st" type="number" min="0" value="1"><label>Description (full details; you can use # headings, **bold** and - bullet points)</label><textarea id="ds" rows="6"></textarea>
  <label>Material / size (optional)</label><input id="mt" placeholder="PLA, 10 cm tall"><label>Photo</label><input id="im" type="file" accept="image/*"><label>3D model file (STL / OBJ / 3MF)</label><input id="fl" type="file">
  <div id="msg" style="margin-top:12px;font-size:.9rem"></div>
  <div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Add model</button></div>`);
  const msg=(t,bad)=>{const m=d.querySelector('#msg');m.textContent=t;m.style.color=bad?'#ff8a8a':'#9a9bb5'};
  d.querySelector('#x').onclick=closeD;
  d.querySelector('#ok').onclick=async e=>{
    const btn=e.target,n=d.querySelector('#n').value.trim(),pr=d.querySelector('#pr').value,st=parseInt(d.querySelector('#st').value,10);
    if(!n||pr==='')return msg('Please enter name and price',1);
    if(isNaN(st)||st<0)return msg('Stock must be 0 or more',1);
    btn.disabled=true;
    try{
      msg('Checking login…');
      const{data:{session}}=await sb.auth.getSession();
      if(!session)throw new Error('You are logged out. Close this, click Owner login, and try again.');
      const im=d.querySelector('#im').files[0],fl=d.querySelector('#fl').files[0];
      if((im&&im.size>50e6)||(fl&&fl.size>50e6))throw new Error('A file is over 50 MB, which is the free plan limit.');
      let i='',f='';
      if(im){msg('Uploading photo…');i=pub(await up('product-media',im))}
      if(fl){msg('Uploading 3D file…');f=pub(await up('product-media',fl))}
      msg('Saving model…');
      const{error}=await sb.from('products').insert({name:n,price:Number(pr),stock:st,description:d.querySelector('#ds').value,material:d.querySelector('#mt').value,image:i,file:f});
      if(error)throw error;
      closeD();await loadProducts();render();
    }catch(err){console.error(err);msg('Error: '+(err.message||JSON.stringify(err)),1);btn.disabled=false}
  };
}
function payBlock(){return `<label>Payment method</label><div class="pay"><label><input type="radio" name="pm" value="COD" checked> 💵 Cash on Delivery</label><label><input type="radio" name="pm" value="Online"> 📱 Online (phone pay)</label></div><div id="pinfo" class="mut hide" style="margin-top:8px">Pay to phone number <b style="color:var(--ink)">${esc(settings.pay_phone||'(not set yet)')}</b> using any UPI app, then enter the transaction ID below.</div><div id="txw" class="hide"><label>Transaction ID</label><input id="tx"></div>`}
function wirePay(d){d.querySelectorAll('[name=pm]').forEach(r=>r.onchange=()=>{const on=d.querySelector('[name=pm]:checked').value==='Online';d.querySelector('#pinfo').classList.toggle('hide',!on);d.querySelector('#txw').classList.toggle('hide',!on)})}
function locBlock(){return `<label>City</label><input id="ct"><label>PIN code</label><input id="pc" inputmode="numeric" maxlength="10"><div style="margin-top:10px"><button type="button" class="btn sm" id="loc">📍 Use my current location</button> <span class="mut" id="locs"></span></div>`}
function wireLoc(d){d.dataset.loc='';d.querySelector('#loc').onclick=()=>{const s=d.querySelector('#locs');if(!navigator.geolocation){s.textContent='Location is not supported on this device';return}s.textContent='Getting location…';
  navigator.geolocation.getCurrentPosition(p=>{d.dataset.loc='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);s.textContent='✓ Location added'},()=>{s.textContent='Could not get location. Please allow location access.'},{timeout:15000,enableHighAccuracy:true})}}
function checkout(p){
  const d=dlg(`<h2 style="font-size:1.3rem">${esc(p.name)} <span class="gt">· ₹${esc(p.price)}</span></h2>
  <label>Quantity (${p.stock} available)</label><input id="qt" type="number" min="1" max="${p.stock}" value="1">
  <label>Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel"><label>Delivery address</label><textarea id="ad" rows="3"></textarea>${locBlock()}${payBlock()}
  <div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Place order</button></div>`);wirePay(d);wireLoc(d);
  d.querySelector('#x').onclick=closeD;
  d.querySelector('#ok').onclick=async e=>{
    const g=s=>d.querySelector(s).value.trim(),qt=parseInt(g('#qt'),10);
    if(!g('#n')||!g('#ph')||!g('#ad')||!g('#ct')||!g('#pc'))return toast('Please fill name, phone, address, city and PIN code');
    if(!(qt>=1)||qt>p.stock)return toast('Please choose a quantity between 1 and '+p.stock);
    e.target.disabled=true;
    const{error}=await sb.rpc('place_order',{p_product_id:p.id,p_quantity:qt,p_name:g('#n'),p_phone:g('#ph'),p_address:g('#ad'),p_city:g('#ct'),p_pincode:g('#pc'),p_location:d.dataset.loc||'',p_payment:d.querySelector('[name=pm]:checked').value,p_txn:g('#tx')});
    if(error){toast('Could not place order: '+error.message);e.target.disabled=false;await loadProducts();render();return}
    const nm=g('#n'),ph=g('#ph');closeD();
    const d2=dlg(`<h2 style="font-size:1.4rem">✅ Order placed!</h2><p class="mut">Thank you, ${esc(nm)}. We’ll contact you on ${esc(ph)} to confirm your order.</p><div class="row"><button class="btn" id="dn">Done</button></div>`);d2.querySelector('#dn').onclick=closeD;
    await loadProducts();render();
  };
}
function custom(m){
  m.innerHTML=`<div class="two"><div><span class="pill">🛠 Custom printing</span><h2 style="font-size:2.2rem">Print <span class="gt">your own</span> 3D model</h2><p class="mut">Have a design? Upload it with your details and we’ll print it and deliver it to you.</p>
  <div class="steps"><div><em>1</em><p style="margin:0"><b>Upload your file</b><span>STL, OBJ or 3MF with size &amp; colour</span></p></div><div><em>2</em><p style="margin:0"><b>We review &amp; quote</b><span>We call you with price and delivery time</span></p></div><div><em>3</em><p style="margin:0"><b>We print &amp; ship</b><span>Pay by Cash on Delivery or online</span></p></div></div></div>
  <div class="box" id="cf"><label style="margin-top:0">Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel"><label>Delivery address</label><textarea id="ad" rows="2"></textarea>${locBlock()}
  <label>Upload your file</label><input id="fl" type="file"><label>Details (size, colour, material, quantity…)</label><textarea id="dt" rows="3"></textarea>${payBlock()}
  <div class="row"><button class="btn" id="ok" style="width:100%">Send request</button></div></div></div>`;
  const f=$('#cf');wirePay(f);wireLoc(f);
  $('#ok').onclick=async e=>{
    const g=s=>f.querySelector(s).value.trim(),file=f.querySelector('#fl').files[0];
    if(!g('#n')||!g('#ph')||!g('#ad')||!g('#ct')||!g('#pc')||!file)return toast('Please fill name, phone, address, city, PIN code and choose a file');
    e.target.disabled=true;e.target.textContent='Uploading…';
    try{const path=await up('custom-files',file);
      const{error}=await sb.from('customs').insert({name:g('#n'),phone:g('#ph'),address:g('#ad'),city:g('#ct'),pincode:g('#pc'),location:f.dataset.loc||'',details:g('#dt'),file:path,file_name:file.name,payment:f.querySelector('[name=pm]:checked').value,txn:f.querySelector('#tx').value});
      if(error)throw error;
      f.innerHTML='<h2 style="font-size:1.4rem">✅ Request sent!</h2><p class="mut">We’ll review your file and contact you with the price and delivery time.</p>';
    }catch(err){toast('Could not send: '+(err.message||err));e.target.disabled=false;e.target.textContent='Send request'}
  };
}
function oc(o,col,c){const ll=(o.location||'').startsWith('https://www.google.com/maps?q=')?o.location.split('q=')[1]:'',ok=/^-?\d+\.\d+,-?\d+\.\d+$/.test(ll),
    dest=ok?ll:encodeURIComponent([o.address,o.city,o.pincode].filter(Boolean).join(', ')),bs='display:inline-block;text-decoration:none;color:var(--ink)',
    map=`<div class="row" style="justify-content:flex-start;margin:8px 0 0">${ok?`<a class="btn sm" style="${bs}" href="https://www.google.com/maps?q=${ll}" target="_blank" rel="noopener">📍 View exact pin</a>`:''}<a class="btn sm" style="${bs}" href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving" target="_blank" rel="noopener">🧭 Get directions</a></div>${ok?'':'<div class="mut">No GPS pin, so directions use the typed address</div>'}`;
  return `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${c?'🛠 Custom print':esc(o.product)+' × '+esc(o.quantity)+' — ₹'+esc(o.price*o.quantity)}</b><span class="tag">${esc(o.status)}</span></div>
  <div class="mut">${esc(o.name)} · <a style="color:var(--b)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${new Date(o.created_at).toLocaleString()}</div><div>${esc(o.address)}${o.city?', '+esc(o.city):''}${o.pincode?' - '+esc(o.pincode):''}</div>${map}<div class="mut">Payment: ${esc(o.payment)}${o.txn?' · Txn '+esc(o.txn):''}</div>
  ${c?`<p>${esc(o.details)}</p><button class="btn sm" data-f="${esc(o.file)}|${esc(o.file_name)}">⬇ Download ${esc(o.file_name)}</button>`:''}
  <div class="row" style="justify-content:flex-start">${['New','Printing','Shipped','Done'].map(s=>`<button class="btn sm" data-s="${col}|${o.id}|${s}">${s}</button>`).join('')}<button class="btn sm" data-d="${col}|${o.id}">Delete</button></div></div>`}
function ordersV(m){
  const all=[...orders.map(o=>oc(o,'orders',0)),...customs.map(o=>oc(o,'customs',1))];
  m.innerHTML=`<div class="sec" style="margin-top:36px"><h2>Your <span class="gt">orders</span></h2><button class="btn sm" id="rf">↻ Refresh</button></div>`+(all.length?all.join(''):'<div class="note">No orders yet.</div>');
  $('#rf').onclick=async()=>{await loadOrders();render()};
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const[t,id,s]=b.dataset.s.split('|');const{error}=await sb.from(t).update({status:s}).eq('id',id);if(error)return toast(error.message);await loadOrders();render()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete?'))return;const[t,id]=b.dataset.d.split('|');const{error}=await sb.from(t).delete().eq('id',id);if(error)return toast(error.message);await loadOrders();render()});
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const[p,n]=b.dataset.f.split('|');const{data,error}=await sb.storage.from('custom-files').createSignedUrl(p,120,{download:n});if(error)return toast(error.message);location.href=data.signedUrl});
}
function settingsV(m){
  m.innerHTML=`<div class="sec" style="margin-top:36px"><h2>Store <span class="gt">settings</span></h2></div><div class="box"><label style="margin-top:0">Phone number for online payment (UPI)</label><input id="sp" type="tel" value="${esc(settings.pay_phone)}"><div class="row"><button class="btn" id="sv">Save</button></div></div>`;
  $('#sv').onclick=async()=>{const{error}=await sb.from('settings').update({pay_phone:$('#sp').value}).eq('id','shop');if(error)return toast(error.message);settings.pay_phone=$('#sp').value;toast('Saved')};
}
$('#ownerbtn').onclick=()=>{
  if(isOwner)return sb.auth.signOut();
  const d=dlg(`<h2 style="font-size:1.3rem">Owner <span class="gt">login</span></h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
  <div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Log in</button></div>`);
  d.querySelector('#x').onclick=closeD;
  d.querySelector('#ok').onclick=async e=>{e.target.disabled=true;
    const{error}=await sb.auth.signInWithPassword({email:d.querySelector('#em').value.trim(),password:d.querySelector('#pw').value});
    if(error){toast('Login failed: '+error.message);e.target.disabled=false}else closeD()};
};
sb.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{
  isOwner=!!s;
  if(isOwner)await loadOrders();else{orders=[];customs=[];if(tab==='orders'||tab==='settings')tab='shop'}
  render()},0)});
(async()=>{
  $('#main').innerHTML='<div class="note" style="margin-top:40px">Loading the store…</div>';
  await Promise.all([loadProducts(),loadSettings(),loadSummary()]);route();
})();
</script></body></html>
